name: 공모주 데이터 갱신

on:
  schedule:
    # 하루 한 번, KST 07:30 (UTC 22:30).
    # 전날 청약 마감·수요예측 결과가 모두 확정된 뒤라 하루치를 한 번에 담는다.
    - cron: "30 22 * * *"
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: ipo-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 수집 실행
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python -m collector.run --pages 3

      - name: 카카오톡 알림
        # 실행이 하루 한 번뿐이라 중복 발송 걱정이 없다. 크론 문자열로 거르던 조건은
        # 스케줄을 바꾸면 조용히 깨지므로 두지 않는다.
        continue-on-error: true      # 알림이 실패해도 데이터 갱신은 막지 않는다
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          SITE_URL: https://zzantech-lucy90.github.io/ipo-calendar/
        run: python -m notify.kakao

      - name: 변경분 커밋
        run: |
          if git diff --quiet -- data/ipos.json; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ipos.json
          git commit -m "데이터 갱신 $(date -u -d '+9 hours' +'%Y-%m-%d %H:%M KST')"
          git push

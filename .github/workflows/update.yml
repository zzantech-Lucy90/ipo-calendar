name: 공모주 데이터 갱신

on:
  schedule:
    # KST 07:30 / 18:30 (UTC 22:30 / 09:30) — 청약 마감 후 경쟁률이 반영될 시간을 둔다
    - cron: "30 22 * * *"
    - cron: "30 9 * * *"
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: ipo-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 수집 실행
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python -m collector.run --pages 3

      - name: 변경분 커밋
        run: |
          if git diff --quiet -- data/ipos.json; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ipos.json
          git commit -m "데이터 갱신 $(date -u -d '+9 hours' +'%Y-%m-%d %H:%M KST')"
          git push
